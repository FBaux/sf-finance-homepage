<html lang="de">
<head>

  <meta name="description" content="DayDom Trading Kurs — Strukturierter Videokurs für Einsteiger und Fortgeschrittene.">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    img { max-width: 100%; display: block; }
    a { text-decoration: none; }

    :root {
      --bg:         #060c1a;
      --card:       #0f1d33;
      --card2:      #0a1628;
      --border:     #1e2e4a;
      --border2:    #162745;
      --accent:     #f0c040;
      --accent-dim: rgba(240,192,64,.08);
      --accent-mid: rgba(240,192,64,.18);
      --accent-border: rgba(201,168,76,.25);
      --gold-mid:   #c9a84c;
      --text:       #e8edf5;
      --text2:      #94a9c8;
      --text3:      #4a6080;
      --f-serif:    'Cormorant Garamond', Georgia, serif;
      --f-body:     'DM Sans', system-ui, sans-serif;
      --f-mono:     'Space Mono', monospace;
      --r:          12px;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--f-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(240,192,64,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240,192,64,.02) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    /* Loading */
    .loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    .loading-spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Topbar */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,29,51,.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 clamp(1rem, 3vw, 2rem);
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-left { display: flex; align-items: center; gap: 1rem; }
    .topbar-logo img { height: 40px; width: auto; }
    .topbar-divider { width: 1px; height: 24px; background: var(--border); }
    .topbar-label {
      font-family: var(--f-mono); font-size: .62rem;
      letter-spacing: .12em; text-transform: uppercase; color: var(--gold-mid);
    }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .topbar-btn {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 6px; padding: .4rem .9rem;
      font-family: var(--f-body); font-size: .75rem; font-weight: 500;
      color: var(--text2); cursor: pointer; transition: all .2s;
    }
    .topbar-btn:hover { border-color: var(--accent-border); color: var(--accent); }

    /* Layout */
    .layout {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      max-width: 1300px;
      margin: 0 auto;
      min-height: calc(100vh - 64px);
    }

    /* Sidebar */
    .sidebar {
      border-right: 1px solid var(--border);
      padding: 1.5rem 0;
      overflow-y: auto;
      position: sticky; top: 64px;
      height: calc(100vh - 64px);
    }

    .sidebar-header {
      padding: 0 1.5rem 1.25rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .sidebar-title {
      font-family: var(--f-serif);
      font-weight: 300;
      font-size: 1.35rem;
      letter-spacing: -.01em;
      margin-bottom: .25rem;
    }
    .sidebar-title em { font-style: italic; color: var(--accent); }
    .sidebar-progress {
      font-family: var(--f-mono);
      font-size: .6rem;
      letter-spacing: .08em;
      color: var(--text3);
    }
    .progress-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-top: .5rem;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width .5s ease;
    }

    /* Module */
    .module {
      margin-bottom: .5rem;
    }
    .module-header {
      display: flex; align-items: center; gap: .6rem;
      padding: .65rem 1.5rem;
      cursor: pointer;
      transition: background .2s;
    }
    .module-header:hover { background: rgba(240,192,64,.04); }
    .module-header.active { background: rgba(240,192,64,.06); }

    .module-number {
      font-family: var(--f-mono);
      font-size: .55rem;
      letter-spacing: .08em;
      color: var(--text3);
      min-width: 24px;
    }
    .module-name {
      font-size: .82rem;
      font-weight: 600;
      color: var(--text);
      flex: 1;
    }
    .module-chevron {
      width: 12px; height: 12px;
      color: var(--text3);
      transition: transform .2s;
      flex-shrink: 0;
    }
    .module.open .module-chevron { transform: rotate(90deg); }

    .module-lessons {
      display: none;
      padding: .25rem 0;
    }
    .module.open .module-lessons { display: block; }

    .lesson-item {
      display: flex; align-items: center; gap: .6rem;
      padding: .5rem 1.5rem .5rem 3.5rem;
      font-size: .78rem;
      color: var(--text2);
      cursor: pointer;
      transition: all .2s;
    }
    .lesson-item:hover { background: rgba(240,192,64,.04); color: var(--text); }
    .lesson-item.active {
      background: rgba(240,192,64,.08);
      color: var(--accent);
      border-right: 2px solid var(--accent);
    }
    .lesson-item.completed { color: var(--text3); }

    .lesson-icon {
      width: 14px; height: 14px;
      flex-shrink: 0;
    }
    .lesson-icon.play { color: var(--text3); }
    .lesson-item.active .lesson-icon.play { color: var(--accent); }
    .lesson-icon.check { color: var(--accent); }

    /* Content area */
    .content {
      padding: 2.5rem clamp(1.5rem, 3vw, 3rem);
    }

    .content-header {
      margin-bottom: 2rem;
    }
    .content-module-label {
      font-family: var(--f-mono);
      font-size: .6rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold-mid);
      margin-bottom: .5rem;
    }
    .content-title {
      font-family: var(--f-serif);
      font-weight: 300;
      font-size: clamp(1.5rem, 3vw, 2rem);
      letter-spacing: -.01em;
      margin-bottom: .5rem;
    }
    .content-meta {
      font-size: .78rem;
      color: var(--text3);
      display: flex; align-items: center; gap: 1rem;
    }

    /* Lesson content */
    .lesson-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 2rem;
    }
    .lesson-content h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: .75rem;
    }
    .lesson-content p {
      font-size: .88rem;
      color: var(--text2);
      font-weight: 300;
      line-height: 1.8;
      margin-bottom: 1rem;
    }
    .lesson-content p:last-child { margin-bottom: 0; }

    /* Navigation buttons */
    .lesson-nav {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 2rem;
    }
    .nav-btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .7rem 1.25rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: var(--f-body);
      font-size: .82rem;
      font-weight: 500;
      color: var(--text2);
      cursor: pointer;
      transition: all .2s;
    }
    .nav-btn:hover {
      border-color: var(--accent-border);
      color: var(--text);
    }
    .nav-btn svg { width: 14px; height: 14px; }
    .nav-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      font-weight: 600;
    }
    .nav-btn.primary:hover {
      background: #ffe070;
      box-shadow: 0 4px 16px rgba(240,192,64,.25);
    }

    /* Mobile sidebar toggle */
    .sidebar-toggle {
      display: none;
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 200;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: var(--bg);
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(240,192,64,.4);
      align-items: center; justify-content: center;
    }
    .sidebar-toggle svg { width: 20px; height: 20px; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; top: 64px; left: 0; bottom: 0;
        width: 300px; z-index: 150;
        background: var(--bg);
        transform: translateX(-100%);
        transition: transform .3s ease;
        height: calc(100vh - 64px);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-toggle { display: flex; }
      .sidebar-overlay {
        display: none;
        position: fixed; inset: 0; top: 64px;
        background: rgba(0,0,0,.5);
        z-index: 149;
      }
      .sidebar-overlay.open { display: block; }
    }
  </style>
</head>

<script>
  const COURSE = [
    {
      id: 'm1',
      title: 'Grundlagen',
      lessons: [
        {
          id: 'l1-1', title: 'Was ist Trading?', duration: '12:00',
          videoUrl: '',
          content: '<h3>Was ist Trading?</h3>' +
            '<p>Trading bedeutet, Finanzinstrumente wie Währungspaare, Aktienindizes oder Rohstoffe über einen begrenzten Zeitraum zu kaufen und zu verkaufen — mit dem Ziel, von Preisbewegungen zu profitieren. Im Gegensatz zum klassischen Investieren, bei dem du Vermögenswerte über Jahre hältst, geht es beim Trading um kürzere Zeiträume: von wenigen Minuten (Scalping) über Stunden (Daytrading) bis hin zu mehreren Tagen (Swingtrading).</p>' +
            '<h3>Wie funktioniert ein Trade?</h3>' +
            '<p>Ein Trade besteht immer aus zwei Aktionen: dem <strong>Einstieg</strong> (Entry) und dem <strong>Ausstieg</strong> (Exit). Dein Gewinn oder Verlust ergibt sich aus der Differenz zwischen diesen beiden Preisen, multipliziert mit deiner Positionsgröße.</p>' +
            '<p><strong>Long-Trade (Kaufen):</strong> Du kaufst ein Asset, weil du erwartest, dass der Preis steigt. Du verkaufst es später zu einem höheren Preis.</p>' +
            '<p><strong>Short-Trade (Verkaufen):</strong> Du verkaufst ein Asset, das du nicht besitzt (Leerverkauf), weil du erwartest, dass der Preis fällt. Du kaufst es später günstiger zurück.</p>' +
            '<h3>Warum Trading?</h3>' +
            '<p>Trading bietet einige einzigartige Vorteile: Du kannst von steigenden <em>und</em> fallenden Märkten profitieren. Du brauchst kein großes Startkapital (besonders mit Prop Firms). Du bist ortsunabhängig. Und du bist dein eigener Chef. Aber — und das ist entscheidend — Trading ist kein Weg zum schnellen Reichtum. Es ist ein Handwerk, das systematisches Lernen, Disziplin und Geduld erfordert.</p>' +
            '<h3>Die Realität des Tradings</h3>' +
            '<p>Statistisch verlieren über 80% der Retail-Trader Geld. Warum? Weil sie ohne Plan, ohne Risikomanagement und ohne echte Ausbildung starten. Genau deshalb gibt es diesen Kurs: Damit du zu den 20% gehörst, die es richtig machen.</p>'
        },
        {
          id: 'l1-2', title: 'Märkte verstehen', duration: '15:00',
          videoUrl: '',
          content: '<h3>Die wichtigsten Märkte</h3>' +
            '<p>Als Trader hast du Zugang zu verschiedenen Märkten. Jeder Markt hat eigene Eigenschaften, Handelszeiten und Volatilitäten. Hier die wichtigsten:</p>' +
            '<h3>Forex (Devisenmarkt)</h3>' +
            '<p>Der größte Finanzmarkt der Welt mit einem täglichen Volumen von über 6 Billionen Dollar. Du tradest Währungspaare wie EUR/USD, GBP/JPY oder USD/CHF. Der Forex-Markt ist 24 Stunden am Tag geöffnet (Mo-Fr) und bietet hohe Liquidität und niedrige Spreads.</p>' +
            '<p><strong>Hauptpaare (Majors):</strong> EUR/USD, GBP/USD, USD/JPY, USD/CHF — die liquidesten Paare mit den niedrigsten Kosten.</p>' +
            '<p><strong>Nebenpaare (Minors):</strong> EUR/GBP, AUD/NZD, GBP/JPY — weniger Volumen, aber oft gute Setups.</p>' +
            '<p><strong>Exotische Paare:</strong> USD/TRY, EUR/ZAR — hohe Volatilität, hohe Spreads, nur für Erfahrene.</p>' +
            '<h3>Indizes</h3>' +
            '<p>Ein Index bildet die Performance eines Aktienmarktes ab. Die beliebtesten zum Traden sind der <strong>US30</strong> (Dow Jones), <strong>NAS100</strong> (Nasdaq), <strong>SPX500</strong> (S&P 500) und der <strong>GER40</strong> (DAX). Indizes bewegen sich oft in klaren Trends und eignen sich gut für technische Analyse.</p>' +
            '<h3>Rohstoffe</h3>' +
            '<p><strong>Gold (XAU/USD)</strong> ist einer der meistgetradeten Rohstoffe — ein sicherer Hafen in unsicheren Zeiten. <strong>Öl (WTI/Brent)</strong> reagiert stark auf geopolitische Ereignisse. Beide bieten große Moves und damit Chancen für Trader.</p>' +
            '<h3>Handelszeiten (Sessions)</h3>' +
            '<p><strong>Sydney-Session:</strong> 22:00 – 07:00 MEZ — geringe Volatilität.</p>' +
            '<p><strong>Tokyo-Session:</strong> 00:00 – 09:00 MEZ — JPY-Paare werden aktiver.</p>' +
            '<p><strong>London-Session:</strong> 08:00 – 17:00 MEZ — die aktivste Session, besonders für Forex.</p>' +
            '<p><strong>New-York-Session:</strong> 13:00 – 22:00 MEZ — hohe Volatilität, vor allem in der Überlappung mit London (13:00-17:00).</p>' +
            '<p>Die <strong>London-New-York Überlappung</strong> (13:00–17:00 MEZ) ist die beste Zeit zum Traden — hier passieren die größten Moves.</p>'
        },
        {
          id: 'l1-3', title: 'Broker & Plattformen', duration: '10:00',
          videoUrl: '',
          content: '<h3>Den richtigen Broker wählen</h3>' +
            '<p>Dein Broker ist dein Zugang zu den Märkten. Er führt deine Orders aus und stellt dir die Handelsplattform zur Verfügung. Die Wahl des richtigen Brokers ist wichtig — aber kein Grund, sich wochenlang den Kopf zu zerbrechen.</p>' +
            '<h3>Worauf du achten musst</h3>' +
            '<p><strong>Regulierung:</strong> Der Broker sollte von einer seriösen Behörde reguliert sein (FCA, CySEC, BaFin, ASIC). Das schützt dein Kapital.</p>' +
            '<p><strong>Spreads & Kommissionen:</strong> Je niedriger, desto besser. Achte auf die Gesamtkosten pro Trade, nicht nur den Spread.</p>' +
            '<p><strong>Ausführungsgeschwindigkeit:</strong> Deine Orders sollten in Millisekunden ausgeführt werden — Slippage kann Geld kosten.</p>' +
            '<p><strong>Hebel (Leverage):</strong> In der EU für Retail-Kunden auf 1:30 begrenzt. Bei Prop Firms gelten andere Regeln.</p>' +
            '<p><strong>Plattform:</strong> Unterstützt der Broker die Plattform, die du nutzen willst?</p>' +
            '<h3>Handelsplattformen</h3>' +
            '<p><strong>MetaTrader 4 (MT4):</strong> Der Klassiker. Stabil, bewährt, riesige Community. Perfekt für Forex-Trading. Etwas veraltet im Design, aber funktional top.</p>' +
            '<p><strong>MetaTrader 5 (MT5):</strong> Die modernere Version mit mehr Timeframes, mehr Ordertypen und einem besseren Backtesting-Tool.</p>' +
            '<p><strong>TradingView:</strong> Die beste Plattform für Chartanalyse. Kostenlos nutzbar, webbasiert, Social-Features. Viele Broker bieten mittlerweile TradingView-Integration an.</p>' +
            '<p><strong>cTrader:</strong> Modern, schnell, transparente Ausführung. Besonders beliebt bei Prop Firms.</p>' +
            '<p>Für den Start empfehlen wir <strong>TradingView für die Analyse</strong> und <strong>MT4/MT5 oder cTrader für die Ausführung</strong>.</p>'
        },
        {
          id: 'l1-4', title: 'Dein erstes Setup', duration: '08:00',
          videoUrl: '',
          content: '<h3>Deinen Arbeitsplatz einrichten</h3>' +
            '<p>Bevor du den ersten Trade setzt, brauchst du ein sauberes Chart-Setup. Weniger ist mehr — zu viele Indikatoren und Zeichnungen machen den Chart unlesbar.</p>' +
            '<h3>Chart konfigurieren</h3>' +
            '<p><strong>Charttyp:</strong> Verwende <strong>Candlestick-Charts</strong>. Sie zeigen dir auf einen Blick den Eröffnungs-, Schluss-, Höchst- und Tiefstkurs jeder Periode.</p>' +
            '<p><strong>Farbschema:</strong> Grüne/weiße Kerzen für steigende Preise, rote/schwarze für fallende. Wähle einen dunklen Hintergrund — schont die Augen bei langen Sessions.</p>' +
            '<p><strong>Zeitrahmen (Timeframes):</strong> Starte mit dem <strong>H4</strong> (4-Stunden) und dem <strong>H1</strong> (1-Stunde) Chart. Der H4 gibt dir den Überblick, der H1 zeigt dir die Details für den Entry.</p>' +
            '<h3>Basis-Indikatoren</h3>' +
            '<p>Für den Anfang brauchst du maximal 2-3 Indikatoren:</p>' +
            '<p><strong>EMA 20 und EMA 50:</strong> Zwei gleitende Durchschnitte, die dir den aktuellen Trend anzeigen. Preis über beiden EMAs = Aufwärtstrend. Preis unter beiden = Abwärtstrend.</p>' +
            '<p><strong>Volumen (optional):</strong> Zeigt dir, ob eine Preisbewegung von echtem Interesse getragen wird oder ob sie auf dünnem Eis steht.</p>' +
            '<h3>Dein Trading-Routine</h3>' +
            '<p>Setze dir feste Zeiten: Zum Beispiel morgens eine 15-minütige Marktanalyse (Top-Down: Daily → H4 → H1), dann Alerts setzen und den Markt beobachten. Trading soll nicht dein ganzes Leben einnehmen — sondern ein kontrollierter, professioneller Prozess sein.</p>'
        },
      ]
    },
    {
      id: 'm2',
      title: 'Chartanalyse',
      lessons: [
        {
          id: 'l2-1', title: 'Candlesticks lesen', duration: '14:00',
          videoUrl: '',
          content: '<h3>Die Sprache der Kerzen</h3>' +
            '<p>Jede Candlestick erzählt dir eine Geschichte über den Kampf zwischen Käufern und Verkäufern in einem bestimmten Zeitraum. Lerne diese Sprache, und du kannst den Markt lesen wie ein Buch.</p>' +
            '<h3>Aufbau einer Candlestick</h3>' +

  let currentLessonId = null;
  let completedLessons = new Set();

  function loadProgress() {
    try {
      const saved = localStorage.getItem('daydom_kurs_progress');
      if (saved) completedLessons = new Set(JSON.parse(saved));
    } catch (e) {}
  }

  function saveProgress() {
    try {
      localStorage.setItem('daydom_kurs_progress', JSON.stringify([...completedLessons]));
    } catch (e) {}
  }

  function renderSidebar() {
    const container = document.getElementById('modules-list');
    container.innerHTML = '';

    COURSE.forEach((mod, mi) => {
      const moduleEl = document.createElement('div');
      moduleEl.className = 'module' + (mi === 0 ? ' open' : '');
      moduleEl.id = 'mod-' + mod.id;

      const header = document.createElement('div');
      header.className = 'module-header';
      header.onclick = () => moduleEl.classList.toggle('open');

      header.innerHTML = `
        <span class="module-number">${String(mi + 1).padStart(2, '0')}</span>
        <span class="module-name">${mod.title}</span>
        <svg class="module-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      `;

      const lessons = document.createElement('div');
      lessons.className = 'module-lessons';

      mod.lessons.forEach(lesson => {
        const item = document.createElement('div');
        item.className = 'lesson-item' + (completedLessons.has(lesson.id) ? ' completed' : '');
        item.dataset.id = lesson.id;
        item.onclick = () => selectLesson(mod, lesson);

        const isCompleted = completedLessons.has(lesson.id);
        const iconSvg = isCompleted
          ? '<svg class="lesson-icon check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
          : '<svg class="lesson-icon play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';

        item.innerHTML = `
          ${iconSvg}
          <span>${lesson.title}</span>
        `;

        lessons.appendChild(item);
      });

      moduleEl.appendChild(header);
      moduleEl.appendChild(lessons);
      container.appendChild(moduleEl);
    });

    updateProgress();
  }

  function updateProgress() {
    const total = COURSE.reduce((sum, m) => sum + m.lessons.length, 0);
    const done = completedLessons.size;
    document.getElementById('progress-text').textContent = `${done} / ${total} Lektionen abgeschlossen`;
    document.getElementById('progress-fill').style.width = total > 0 ? (done / total * 100) + '%' : '0%';
  }

  function selectLesson(mod, lesson) {
    currentLessonId = lesson.id;

    document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));
    const item = document.querySelector(`.lesson-item[data-id="${lesson.id}"]`);
    if (item) item.classList.add('active');

    const mi = COURSE.indexOf(mod);
    document.getElementById('current-module-label').textContent = `Modul ${String(mi + 1).padStart(2, '0')} — ${mod.title}`;
    document.getElementById('current-lesson-title').textContent = lesson.title;
    document.getElementById('current-lesson-meta').textContent = '';

    document.getElementById('lesson-description').innerHTML = lesson.content;

    document.getElementById('lesson-nav').style.display = '';

    const modEl = document.getElementById('mod-' + mod.id);
    if (modEl && !modEl.classList.contains('open')) {
      modEl.classList.add('open');
    }

    if (window.innerWidth <= 768) {
      toggleSidebar();
    }
  }

  function getAllLessons() {
    const all = [];
    COURSE.forEach(mod => mod.lessons.forEach(l => all.push({ mod, lesson: l })));
    return all;
  }

  function prevLesson() {
    const all = getAllLessons();
    const idx = all.findIndex(x => x.lesson.id === currentLessonId);
    if (idx > 0) selectLesson(all[idx - 1].mod, all[idx - 1].lesson);
  }

  function nextLesson() {
    const all = getAllLessons();
    const idx = all.findIndex(x => x.lesson.id === currentLessonId);
    if (idx >= 0 && idx < all.length - 1) {
      completedLessons.add(currentLessonId);
      saveProgress();
      renderSidebar();
      selectLesson(all[idx + 1].mod, all[idx + 1].lesson);
    }
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
  }

  async function handleSignOut() {
    await signOut();
  }

  async function init() {
    const session = await requireAuth();
    if (!session) return;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('main-content').style.display = '';
    document.getElementById('sidebarToggle').style.display = '';

    loadProgress();
    renderSidebar();
  }

  init();
</script>
