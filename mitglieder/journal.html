<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Journal — DayDom Performance Group</title>
  <meta name="description" content="Dein persönliches Trading Journal — DayDom Performance Group">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    img { max-width: 100%; display: block; }
    a { text-decoration: none; }

    :root {
      --bg:         #060c1a;
      --card:       #0f1d33;
      --card2:      #0a1628;
      --border:     #1e2e4a;
      --border2:    #162745;
      --accent:     #f0c040;
      --accent-dim: rgba(240,192,64,.08);
      --accent-mid: rgba(240,192,64,.18);
      --accent-border: rgba(201,168,76,.25);
      --gold-mid:   #c9a84c;
      --danger:     #f05252;
      --success:    #22c55e;
      --text:       #e8edf5;
      --text2:      #94a9c8;
      --text3:      #4a6080;
      --f-serif:    'Cormorant Garamond', Georgia, serif;
      --f-body:     'DM Sans', system-ui, sans-serif;
      --f-mono:     'Space Mono', monospace;
      --r:          12px;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--f-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(240,192,64,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240,192,64,.02) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    .loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    .loading-spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Topbar */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,29,51,.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 clamp(1rem, 3vw, 2rem);
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-left { display: flex; align-items: center; gap: 1rem; }
    .topbar-logo img { height: 40px; width: auto; }
    .topbar-divider { width: 1px; height: 24px; background: var(--border); }
    .topbar-label {
      font-family: var(--f-mono);
      font-size: .62rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold-mid);
    }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .topbar-user {
      font-size: .78rem;
      color: var(--text2);
      display: flex; align-items: center; gap: .5rem;
    }
    .topbar-user-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .topbar-btn {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .4rem .9rem;
      font-family: var(--f-body);
      font-size: .75rem;
      font-weight: 500;
      color: var(--text2);
      cursor: pointer;
      transition: all .2s;
    }
    .topbar-btn:hover {
      border-color: var(--accent-border);
      color: var(--accent);
    }

    /* Main */
    .main {
      position: relative; z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem clamp(1rem, 3vw, 2rem) 5rem;
    }

    /* Header */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem;
      margin-bottom: 2rem;
    }
    .page-header-left { display: flex; flex-direction: column; gap: .25rem; }
    .back-link {
      font-size: .78rem;
      color: var(--text3);
      display: inline-flex; align-items: center; gap: .4rem;
      margin-bottom: .5rem;
      transition: color .2s;
    }
    .back-link:hover { color: var(--accent); }
    .back-link svg { width: 14px; height: 14px; }
    .page-title {
      font-family: var(--f-serif);
      font-weight: 300;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      letter-spacing: -.01em;
    }
    .page-title em { font-style: italic; color: var(--accent); }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 1.25rem 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,.15), transparent);
    }
    .stat-label {
      font-family: var(--f-mono);
      font-size: .58rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: .4rem;
    }
    .stat-value {
      font-family: var(--f-body);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .stat-value.positive { color: var(--success); }
    .stat-value.negative { color: var(--danger); }

    /* Add trade form */
    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 2rem;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    }
    .form-card::before {
      content: '';
      position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,.15), transparent);
    }
    .form-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
      cursor: pointer;
    }
    .form-title {
      font-family: var(--f-body);
      font-weight: 700;
      font-size: 1rem;
      display: flex; align-items: center; gap: .75rem;
    }
    .form-title svg { width: 18px; height: 18px; color: var(--accent); }
    .form-toggle {
      font-size: .72rem;
      color: var(--text3);
      transition: color .2s;
    }
    .form-header:hover .form-toggle { color: var(--accent); }

    .form-body { display: none; }
    .form-body.open { display: block; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }
    .form-group { display: flex; flex-direction: column; gap: .35rem; }
    .form-group.full { grid-column: 1 / -1; }
    .form-label {
      font-size: .65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--text3);
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .65rem .9rem;
      font-family: var(--f-body);
      font-size: .85rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: rgba(240,192,64,.4);
      box-shadow: 0 0 0 3px rgba(240,192,64,.08);
    }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--text3); }
    .form-select { cursor: pointer; }
    .form-select option { background: var(--card); color: var(--text); }
    .form-textarea { min-height: 60px; resize: vertical; }

    .form-actions {
      display: flex; gap: .75rem;
      margin-top: 1.25rem;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      font-family: var(--f-body);
      font-weight: 700;
      font-size: .82rem;
      padding: .7rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s, box-shadow .2s, transform .15s;
    }
    .btn-primary:hover {
      background: #ffe070;
      box-shadow: 0 6px 20px rgba(240,192,64,.3);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text2);
      font-family: var(--f-body);
      font-weight: 500;
      font-size: .82rem;
      padding: .7rem 1.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-secondary:hover {
      border-color: var(--accent-border);
      color: var(--text);
    }

    /* Trade list */
    .trades-section { margin-top: .5rem; }
    .trades-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .trades-title {
      font-family: var(--f-mono);
      font-size: .65rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text3);
      display: flex; align-items: center; gap: .75rem;
    }
    .trades-title::after {
      content: '';
      flex: 1; height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }
    .trades-filter {
      display: flex; gap: .5rem;
    }
    .filter-btn {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .35rem .75rem;
      font-family: var(--f-body);
      font-size: .7rem;
      font-weight: 500;
      color: var(--text3);
      cursor: pointer;
      transition: all .2s;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: var(--accent-border);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .trades-empty {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text3);
      font-size: .88rem;
    }
    .trades-empty svg {
      width: 40px; height: 40px;
      color: var(--text3);
      margin: 0 auto .75rem;
      opacity: .5;
    }

    .trade-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 1.25rem 1.5rem;
      margin-bottom: .75rem;
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 1.25rem;
      transition: border-color .2s;
    }
    .trade-item:hover { border-color: var(--accent-border); }

    .trade-dir {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--f-mono);
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .05em;
    }
    .trade-dir.long {
      background: rgba(34,197,94,.1);
      border: 1px solid rgba(34,197,94,.2);
      color: var(--success);
    }
    .trade-dir.short {
      background: rgba(240,82,82,.1);
      border: 1px solid rgba(240,82,82,.2);
      color: var(--danger);
    }

    .trade-info { min-width: 0; }
    .trade-pair {
      font-weight: 700;
      font-size: .95rem;
      margin-bottom: .15rem;
    }
    .trade-meta {
      font-size: .72rem;
      color: var(--text3);
      display: flex; flex-wrap: wrap; gap: .5rem;
    }
    .trade-meta span { display: flex; align-items: center; gap: .25rem; }

    .trade-pnl {
      font-family: var(--f-mono);
      font-size: .95rem;
      font-weight: 700;
      text-align: right;
    }

    .trade-actions {
      display: flex; gap: .35rem;
    }
    .trade-action-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all .2s;
    }
    .trade-action-btn svg { width: 13px; height: 13px; color: var(--text3); }
    .trade-action-btn:hover {
      border-color: var(--accent-border);
    }
    .trade-action-btn:hover svg { color: var(--accent); }
    .trade-action-btn.delete:hover {
      border-color: rgba(240,82,82,.3);
    }
    .trade-action-btn.delete:hover svg { color: var(--danger); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(6,12,26,.8);
      backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: 100%; max-width: 500px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-title {
      font-family: var(--f-body);
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 640px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .trade-item {
        grid-template-columns: auto 1fr auto;
        gap: .75rem;
      }
      .trade-actions { display: none; }
      .trade-item:hover .trade-actions { display: flex; }
      .topbar-user { display: none; }
      .form-grid { grid-template-columns: 1fr 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; }
    }

    @media (max-width: 420px) {
      .stats-row { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="loading-screen" id="loading">
  <div class="loading-spinner"></div>
</div>

<nav class="topbar">
  <div class="topbar-left">
    <a href="/" class="topbar-logo">
      <img src="/assets/img/daydom_logo_full_dark_bg.png" alt="DayDom Performance Group">
    </a>
    <div class="topbar-divider"></div>
    <span class="topbar-label">Trading Journal</span>
  </div>
  <div class="topbar-right">
    <div class="topbar-user">
      <span class="topbar-user-dot"></span>
      <span id="user-email"></span>
    </div>
    <button class="topbar-btn" onclick="handleSignOut()">Abmelden</button>
  </div>
</nav>

<div class="main" id="main-content" style="display:none">

  <div class="page-header">
    <div class="page-header-left">
      <a href="/mitglieder/" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Zurück zum Dashboard
      </a>
      <h1 class="page-title">Trading <em>Journal</em></h1>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Trades gesamt</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Win-Rate</div>
      <div class="stat-value" id="stat-winrate">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Gesamt P&L</div>
      <div class="stat-value" id="stat-pnl">0.00 €</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Bester Trade</div>
      <div class="stat-value" id="stat-best">—</div>
    </div>
  </div>

  <!-- Add Trade Form -->
  <div class="form-card">
    <div class="form-header" onclick="toggleForm()">
      <div class="form-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Neuen Trade eintragen
      </div>
      <span class="form-toggle" id="form-toggle-text">Aufklappen</span>
    </div>
    <div class="form-body" id="trade-form-body">
      <form id="trade-form" onsubmit="handleAddTrade(event)">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="trade-date">Datum</label>
            <input class="form-input" id="trade-date" type="date" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="trade-pair">Asset / Paar</label>
            <input class="form-input" id="trade-pair" type="text" placeholder="z.B. EUR/USD" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="trade-direction">Richtung</label>
            <select class="form-select" id="trade-direction" required>
              <option value="long">Long</option>
              <option value="short">Short</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="trade-size">Lot-Größe</label>
            <input class="form-input" id="trade-size" type="number" step="0.01" min="0.01" placeholder="z.B. 1.00" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="trade-entry">Einstieg</label>
            <input class="form-input" id="trade-entry" type="number" step="any" placeholder="Einstiegspreis" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="trade-exit">Ausstieg</label>
            <input class="form-input" id="trade-exit" type="number" step="any" placeholder="Ausstiegspreis" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="trade-pnl">P&L (€)</label>
            <input class="form-input" id="trade-pnl" type="number" step="0.01" placeholder="Gewinn/Verlust" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="trade-result">Ergebnis</label>
            <select class="form-select" id="trade-result" required>
              <option value="win">Gewinn</option>
              <option value="loss">Verlust</option>
              <option value="breakeven">Breakeven</option>
            </select>
          </div>
          <div class="form-group full">
            <label class="form-label" for="trade-notes">Notizen</label>
            <textarea class="form-textarea" id="trade-notes" placeholder="Was lief gut? Was hättest du besser machen können?"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-primary" type="submit">Trade speichern</button>
          <button class="btn-secondary" type="button" onclick="resetForm()">Zurücksetzen</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Trade List -->
  <div class="trades-section">
    <div class="trades-header">
      <div class="trades-title">Deine Trades</div>
      <div class="trades-filter">
        <button class="filter-btn active" onclick="filterTrades('all', this)">Alle</button>
        <button class="filter-btn" onclick="filterTrades('win', this)">Gewinne</button>
        <button class="filter-btn" onclick="filterTrades('loss', this)">Verluste</button>
      </div>
    </div>
    <div id="trades-list"></div>
  </div>

</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3 class="modal-title">Trade bearbeiten</h3>
    <form id="edit-form" onsubmit="handleEditTrade(event)">
      <input type="hidden" id="edit-id">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="edit-date">Datum</label>
          <input class="form-input" id="edit-date" type="date" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-pair">Asset / Paar</label>
          <input class="form-input" id="edit-pair" type="text" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-direction">Richtung</label>
          <select class="form-select" id="edit-direction" required>
            <option value="long">Long</option>
            <option value="short">Short</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-size">Lot-Größe</label>
          <input class="form-input" id="edit-size" type="number" step="0.01" min="0.01" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-entry">Einstieg</label>
          <input class="form-input" id="edit-entry" type="number" step="any" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-exit">Ausstieg</label>
          <input class="form-input" id="edit-exit" type="number" step="any" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-pnl-field">P&L (€)</label>
          <input class="form-input" id="edit-pnl-field" type="number" step="0.01" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-result">Ergebnis</label>
          <select class="form-select" id="edit-result" required>
            <option value="win">Gewinn</option>
            <option value="loss">Verlust</option>
            <option value="breakeven">Breakeven</option>
          </select>
        </div>
        <div class="form-group full">
          <label class="form-label" for="edit-notes">Notizen</label>
          <textarea class="form-textarea" id="edit-notes"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-primary" type="submit">Speichern</button>
        <button class="btn-secondary" type="button" onclick="closeEditModal()">Abbrechen</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/js/supabase-auth.js"></script>
<script>
  let trades = [];
  let currentFilter = 'all';
  let currentUserId = null;

  function getStorageKey() {
    return 'daydom_journal_' + currentUserId;
  }

  function loadTrades() {
    const stored = localStorage.getItem(getStorageKey());
    trades = stored ? JSON.parse(stored) : [];
    trades.sort(function(a, b) { return b.date.localeCompare(a.date) || b.id - a.id; });
  }

  function saveTrades() {
    localStorage.setItem(getStorageKey(), JSON.stringify(trades));
  }

  function toggleForm() {
    var body = document.getElementById('trade-form-body');
    var text = document.getElementById('form-toggle-text');
    body.classList.toggle('open');
    text.textContent = body.classList.contains('open') ? 'Zuklappen' : 'Aufklappen';
  }

  function resetForm() {
    document.getElementById('trade-form').reset();
    document.getElementById('trade-date').value = new Date().toISOString().split('T')[0];
  }

  function handleAddTrade(e) {
    e.preventDefault();
    var trade = {
      id: Date.now(),
      date: document.getElementById('trade-date').value,
      pair: document.getElementById('trade-pair').value.trim().toUpperCase(),
      direction: document.getElementById('trade-direction').value,
      size: parseFloat(document.getElementById('trade-size').value),
      entry: parseFloat(document.getElementById('trade-entry').value),
      exit: parseFloat(document.getElementById('trade-exit').value),
      pnl: parseFloat(document.getElementById('trade-pnl').value),
      result: document.getElementById('trade-result').value,
      notes: document.getElementById('trade-notes').value.trim()
    };
    trades.push(trade);
    saveTrades();
    resetForm();
    document.getElementById('trade-form-body').classList.remove('open');
    document.getElementById('form-toggle-text').textContent = 'Aufklappen';
    renderAll();
  }

  function openEditModal(id) {
    var trade = trades.find(function(t) { return t.id === id; });
    if (!trade) return;
    document.getElementById('edit-id').value = id;
    document.getElementById('edit-date').value = trade.date;
    document.getElementById('edit-pair').value = trade.pair;
    document.getElementById('edit-direction').value = trade.direction;
    document.getElementById('edit-size').value = trade.size;
    document.getElementById('edit-entry').value = trade.entry;
    document.getElementById('edit-exit').value = trade.exit;
    document.getElementById('edit-pnl-field').value = trade.pnl;
    document.getElementById('edit-result').value = trade.result;
    document.getElementById('edit-notes').value = trade.notes || '';
    document.getElementById('edit-modal').classList.add('open');
  }

  function closeEditModal() {
    document.getElementById('edit-modal').classList.remove('open');
  }

  function handleEditTrade(e) {
    e.preventDefault();
    var id = parseInt(document.getElementById('edit-id').value);
    var idx = trades.findIndex(function(t) { return t.id === id; });
    if (idx === -1) return;
    trades[idx] = {
      id: id,
      date: document.getElementById('edit-date').value,
      pair: document.getElementById('edit-pair').value.trim().toUpperCase(),
      direction: document.getElementById('edit-direction').value,
      size: parseFloat(document.getElementById('edit-size').value),
      entry: parseFloat(document.getElementById('edit-entry').value),
      exit: parseFloat(document.getElementById('edit-exit').value),
      pnl: parseFloat(document.getElementById('edit-pnl-field').value),
      result: document.getElementById('edit-result').value,
      notes: document.getElementById('edit-notes').value.trim()
    };
    saveTrades();
    closeEditModal();
    renderAll();
  }

  function deleteTrade(id) {
    if (!confirm('Trade wirklich löschen?')) return;
    trades = trades.filter(function(t) { return t.id !== id; });
    saveTrades();
    renderAll();
  }

  function filterTrades(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    renderTrades();
  }

  function renderStats() {
    var total = trades.length;
    var wins = trades.filter(function(t) { return t.result === 'win'; }).length;
    var totalPnl = trades.reduce(function(s, t) { return s + t.pnl; }, 0);
    var best = trades.length > 0 ? Math.max.apply(null, trades.map(function(t) { return t.pnl; })) : 0;

    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-winrate').textContent = total > 0 ? (wins / total * 100).toFixed(1) + '%' : '—';

    var pnlEl = document.getElementById('stat-pnl');
    pnlEl.textContent = (totalPnl >= 0 ? '+' : '') + totalPnl.toFixed(2) + ' €';
    pnlEl.className = 'stat-value ' + (totalPnl >= 0 ? 'positive' : 'negative');

    var bestEl = document.getElementById('stat-best');
    if (total > 0) {
      bestEl.textContent = (best >= 0 ? '+' : '') + best.toFixed(2) + ' €';
      bestEl.className = 'stat-value ' + (best >= 0 ? 'positive' : 'negative');
    } else {
      bestEl.textContent = '—';
      bestEl.className = 'stat-value';
    }
  }

  function renderTrades() {
    var container = document.getElementById('trades-list');
    var filtered = currentFilter === 'all'
      ? trades
      : trades.filter(function(t) { return t.result === currentFilter; });

    if (filtered.length === 0) {
      container.innerHTML =
        '<div class="trades-empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>' +
          '<div>' + (currentFilter === 'all' ? 'Noch keine Trades eingetragen.' : 'Keine Trades mit diesem Filter.') + '</div>' +
        '</div>';
      return;
    }

    container.innerHTML = filtered.map(function(t) {
      var pnlClass = t.pnl >= 0 ? 'positive' : 'negative';
      var pnlText = (t.pnl >= 0 ? '+' : '') + t.pnl.toFixed(2) + ' €';
      var dateStr = new Date(t.date + 'T00:00:00').toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
      return (
        '<div class="trade-item">' +
          '<div class="trade-dir ' + t.direction + '">' + (t.direction === 'long' ? 'BUY' : 'SELL') + '</div>' +
          '<div class="trade-info">' +
            '<div class="trade-pair">' + escapeHtml(t.pair) + '</div>' +
            '<div class="trade-meta">' +
              '<span>' + dateStr + '</span>' +
              '<span>' + t.size + ' Lot</span>' +
              '<span>' + t.entry + ' → ' + t.exit + '</span>' +
            '</div>' +
            (t.notes ? '<div style="margin-top:.4rem;font-size:.75rem;color:var(--text3);line-height:1.5">' + escapeHtml(t.notes) + '</div>' : '') +
          '</div>' +
          '<div class="trade-pnl ' + pnlClass + '">' + pnlText + '</div>' +
          '<div class="trade-actions">' +
            '<button class="trade-action-btn" onclick="openEditModal(' + t.id + ')" title="Bearbeiten">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
            '</button>' +
            '<button class="trade-action-btn delete" onclick="deleteTrade(' + t.id + ')" title="Löschen">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
            '</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function renderAll() {
    loadTrades();
    renderStats();
    renderTrades();
  }

  async function init() {
    var session = await requireAuth();
    if (!session) return;

    currentUserId = session.user.id;
    document.getElementById('user-email').textContent = session.user.email;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('main-content').style.display = '';
    document.getElementById('trade-date').value = new Date().toISOString().split('T')[0];
    renderAll();
  }

  async function handleSignOut() {
    await signOut();
  }

  document.getElementById('edit-modal').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
  });

  init();
</script>
</body>
</html>
