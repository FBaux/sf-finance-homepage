<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayDom — Chart-Training</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'DM Sans',system-ui,sans-serif;background:#0c1220;color:#e8edf5;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 18px;background:#10192b;border-bottom:1px solid #1e2e4a;flex:0 0 auto}
  .bar-brand{display:flex;align-items:center;gap:10px;font-family:monospace;
    font-size:.72rem;letter-spacing:.08em;color:#aebbd6;text-decoration:none}
  .bar-brand b{color:#d4b96a}
  .logout{background:transparent;color:#aebbd6;border:1px solid #1e2e4a;border-radius:8px;
    padding:7px 14px;font-size:.82rem;cursor:pointer;transition:.15s}
  .logout:hover{border-color:#d4b96a;color:#fff}
  #content-frame{flex:1 1 auto;width:100%;border:none;background:#0a0e17}
  .state{flex:1 1 auto;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}
  .state .inner{max-width:420px}
  .spinner{width:34px;height:34px;border:3px solid #1e2e4a;border-top-color:#d4b96a;border-radius:50%;
    animation:spin .7s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .retry{margin-top:16px;background:#d4b96a;color:#0c1220;border:none;border-radius:8px;
    padding:10px 20px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <div class="bar">
    <a class="bar-brand" href="/mitglieder/"><b>DAYDOM</b> · MITGLIEDERBEREICH</a>
    <button class="logout" id="logout-btn">Abmelden</button>
  </div>

  <div class="state" id="state">
    <div class="inner">
      <div class="spinner" id="spinner"></div>
      <p id="state-msg">Chart-Training wird geladen …</p>
      <button class="retry" id="retry-btn" style="display:none">Erneut versuchen</button>
    </div>
  </div>

  <!-- Inhalt kommt aus dem privaten Bucket (RLS) und läuft im same-origin srcdoc-iframe,
       damit localStorage-Fortschritt weiter funktioniert. -->
  <iframe id="content-frame" title="DayDom Chart-Training" style="display:none"></iframe>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.min.js" integrity="sha384-DjOvX/sJLsmbMrw4wTvf6l3kiGBjdxyOO6X2MTFwOOXGkjN/mE08BoDzrpaaIjil" crossorigin="anonymous"></script>
<script src="/assets/js/supabase-auth.js"></script>
<script>
  var OBJECT = 'quiz.html';

  document.getElementById('logout-btn').addEventListener('click', function(){ signOut(); });

  var stateEl = document.getElementById('state');
  var spinner = document.getElementById('spinner');
  var msg     = document.getElementById('state-msg');
  var retry   = document.getElementById('retry-btn');
  var frame   = document.getElementById('content-frame');

  function showError(text) {
    spinner.style.display = 'none';
    msg.textContent = text;
    retry.style.display = '';
  }

  async function load() {
    spinner.style.display = '';
    retry.style.display = 'none';
    msg.textContent = 'Chart-Training wird geladen …';
    try {
      var html = await fetchProtected(OBJECT);
      frame.srcdoc = html;
      frame.style.display = '';
      stateEl.style.display = 'none';
    } catch (ex) {
      var code = Number((ex && (ex.status || ex.statusCode)) || 0);
      if (code === 401 || code === 403) {
        // Session serverseitig abgelaufen/ungültig — sauber abmelden
        await signOut();
        return;
      }
      showError('Inhalt konnte nicht geladen werden. Bitte später erneut versuchen.');
    }
  }

  retry.addEventListener('click', load);

  (async function(){
    var session = await requireAuth();
    if (session) load();
  })();
</script>
</body>
</html>
