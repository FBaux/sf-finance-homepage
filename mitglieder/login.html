<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — DayDom Performance Group</title>
  <meta name="description" content="Mitgliederbereich Login — DayDom Performance Group">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #060c1a;
      --card:       #0f1d33;
      --card2:      #0a1628;
      --border:     #1e2e4a;
      --border2:    #162745;
      --accent:     #f0c040;
      --accent-dim: rgba(240,192,64,.08);
      --accent-mid: rgba(240,192,64,.18);
      --accent-border: rgba(201,168,76,.25);
      --danger:     #f05252;
      --success:    #22c55e;
      --text:       #e8edf5;
      --text2:      #8a8070;
      --text3:      #3d4050;
      --f-serif:    'Cormorant Garamond', Georgia, serif;
      --f-body:     'DM Sans', system-ui, sans-serif;
      --f-mono:     'Space Mono', monospace;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--f-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(240,192,64,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240,192,64,.025) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(59,130,246,.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 80%, rgba(201,168,76,.04) 0%, transparent 50%);
    }

    .login-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .login-logo img {
      height: 80px;
      width: auto;
      margin: 0 auto;
      filter: drop-shadow(0 4px 16px rgba(201,168,76,.3));
    }
    .login-logo-sub {
      font-family: var(--f-mono);
      font-size: .62rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text3);
      margin-top: .75rem;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,.3), transparent);
    }

    .login-title {
      font-family: var(--f-serif);
      font-weight: 300;
      font-size: 1.75rem;
      letter-spacing: -.01em;
      color: var(--text);
      margin-bottom: .35rem;
      text-align: center;
    }
    .login-title em { font-style: italic; color: var(--accent); }

    .login-subtitle {
      font-size: .8rem;
      color: var(--text2);
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Form */
    .auth-form { display: flex; flex-direction: column; gap: 1rem; }

    .form-group { display: flex; flex-direction: column; gap: .4rem; }

    .form-label {
      font-size: .68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--text3);
    }

    .form-input {
      width: 100%;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .75rem 1rem;
      font-family: var(--f-body);
      font-size: .9rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-input:focus {
      border-color: rgba(240,192,64,.4);
      box-shadow: 0 0 0 3px rgba(240,192,64,.08);
    }
    .form-input::placeholder { color: var(--text3); }

    .form-submit {
      width: 100%;
      background: var(--accent);
      color: var(--bg);
      font-family: var(--f-body);
      font-weight: 700;
      font-size: .9rem;
      padding: .85rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s, box-shadow .2s, transform .15s;
      margin-top: .5rem;
      position: relative;
      overflow: hidden;
    }
    .form-submit:hover {
      background: #ffe070;
      box-shadow: 0 8px 28px rgba(240,192,64,.3);
      transform: translateY(-1px);
    }
    .form-submit:active { transform: translateY(0); }
    .form-submit:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .form-submit::after {
      content: '';
      position: absolute; top: 0; left: -130%;
      width: 60%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.4), transparent);
      transform: skewX(-18deg);
      transition: left .6s cubic-bezier(.22,1,.36,1);
      pointer-events: none;
    }
    .form-submit:hover::after { left: 150%; }

    /* Messages */
    .auth-message {
      font-size: .78rem;
      padding: .7rem .9rem;
      border-radius: 6px;
      margin-top: .5rem;
      display: none;
      line-height: 1.5;
    }
    .auth-message.error {
      display: block;
      background: rgba(240,82,82,.1);
      border: 1px solid rgba(240,82,82,.25);
      color: var(--danger);
    }
    .auth-message.success {
      display: block;
      background: rgba(34,197,94,.1);
      border: 1px solid rgba(34,197,94,.25);
      color: var(--success);
    }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 2rem;
    }
    .login-footer a {
      font-size: .78rem;
      color: var(--text3);
      text-decoration: none;
      transition: color .2s;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
    }
    .login-footer a:hover { color: var(--accent); }
    .login-footer a svg { width: 12px; height: 12px; }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(6,12,26,.2);
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      body { padding: 1rem; }
      .login-card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

<div class="login-container">

  <div class="login-logo">
    <img src="/assets/img/daydom_logo_full_dark_bg.png" alt="DayDom Performance Group">
    <div class="login-logo-sub">Mitgliederbereich</div>
  </div>

  <div class="login-card">
    <h1 class="login-title">Willkommen <em>zurück.</em></h1>
    <p class="login-subtitle">Melde dich mit deinem Konto an.</p>

    <form class="auth-form" id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="login-email">E-Mail</label>
        <input class="form-input" id="login-email" type="email" placeholder="deine@email.de" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="login-password">Passwort</label>
        <input class="form-input" id="login-password" type="password" placeholder="Passwort eingeben" required autocomplete="current-password">
      </div>
      <button class="form-submit" type="submit" id="login-btn">Anmelden</button>
      <div class="auth-message" id="login-msg"></div>
    </form>
  </div>

  <div class="login-footer">
    <a href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Zurück zur Startseite
    </a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/js/supabase-auth.js"></script>
<script>
  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'auth-message ' + type;
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    if (loading) {
      btn.disabled = true;
      btn.dataset.text = btn.textContent;
      btn.innerHTML = '<span class="spinner"></span>Bitte warten…';
    } else {
      btn.disabled = false;
      btn.textContent = btn.dataset.text;
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    setLoading('login-btn', true);
    document.getElementById('login-msg').className = 'auth-message';

    const { error } = await signIn(email, password);

    if (error) {
      setLoading('login-btn', false);
      const msg = error.message === 'Invalid login credentials'
        ? 'E-Mail oder Passwort ist falsch.'
        : error.message;
      showMsg('login-msg', msg, 'error');
    } else {
      window.location.href = '/mitglieder/';
    }
  }

  redirectIfLoggedIn();
</script>
</body>
</html>
