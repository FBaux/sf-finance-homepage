<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="SF Finance Wordmark">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="50%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#e8b84b"/>
    </linearGradient>
    <filter id="gold_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,300&amp;display=swap');
    </style>
  </defs>

  <!-- SF -->
  <text x="2" y="50"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-weight="700" font-size="52" letter-spacing="5"
    fill="url(#gold)">SF</text>

  <!-- Thin vertical divider -->
  <rect x="90" y="8" width="1" height="46" rx="0.5" fill="#c9a84c" opacity="0.35"/>
  <circle cx="90" cy="12" r="2.5" fill="#f0c040" opacity="0.85" filter="url(#gold_glow)"/>

  <!-- Finance — italic light -->
  <text x="104" y="38"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-weight="300" font-style="italic" font-size="22" letter-spacing="4"
    fill="#e8edf5">Finance</text>
</svg>
