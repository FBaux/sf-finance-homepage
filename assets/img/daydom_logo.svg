<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140"
     role="img" aria-label="DayDom Performance Group">
  <defs>
    <!-- Background -->
    <linearGradient id="dlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="100%" stop-color="#0b1524"/>
    </linearGradient>
    <!-- Red gradient (bearish) -->
    <linearGradient id="dlRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7070"/>
      <stop offset="55%" stop-color="#e02020"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <!-- Green gradient (bullish) -->
    <linearGradient id="dlGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5ef59a"/>
      <stop offset="55%" stop-color="#18c058"/>
      <stop offset="100%" stop-color="#065c28"/>
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="dlText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8edf5"/>
      <stop offset="100%" stop-color="#b8c8dc"/>
    </linearGradient>
    <!-- Red letter glow -->
    <filter id="dlRedGlow" x="-50%" y="-40%" width="200%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#ff1a1a" flood-opacity="0.5" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Green letter glow -->
    <filter id="dlGreenGlow" x="-50%" y="-40%" width="200%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#00ee44" flood-opacity="0.4" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Small glow -->
    <filter id="dlSmall" x="-80%" y="-80%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Gold glow (for separator dot) -->
    <filter id="dlGold">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=Inter:wght@300;700;900&amp;display=swap');
    </style>
  </defs>

  <!-- Background card -->
  <rect width="520" height="140" rx="18" fill="url(#dlBg)"/>
  <!-- Outer border -->
  <rect x="1" y="1" width="518" height="138" rx="17"
        fill="none" stroke="#1d2e4a" stroke-width="1.2"/>
  <!-- Inner border -->
  <rect x="5" y="5" width="510" height="130" rx="13"
        fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>

  <!-- Corner accent dots -->
  <circle cx="18" cy="18" r="2" fill="#1d2e4a" opacity="0.9"/>
  <circle cx="502" cy="18" r="2" fill="#1d2e4a" opacity="0.9"/>
  <circle cx="18" cy="122" r="1.5" fill="#1d2e4a" opacity="0.5"/>
  <circle cx="502" cy="122" r="1.5" fill="#1d2e4a" opacity="0.5"/>

  <!-- Trading terminal grid (very faint) -->
  <line x1="10" y1="70" x2="510" y2="70" stroke="#ffffff" stroke-opacity="0.022" stroke-width="1"/>
  <line x1="10" y1="42" x2="510" y2="42" stroke="#ffffff" stroke-opacity="0.014" stroke-width="1"/>
  <line x1="10" y1="98" x2="510" y2="98" stroke="#ffffff" stroke-opacity="0.014" stroke-width="1"/>

  <!-- ================================================
       BEARISH CANDLESTICK — above left D
       Centered at x=43
  ================================================ -->
  <g filter="url(#dlSmall)">
    <line x1="43" y1="10" x2="43" y2="17" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="38" y="17" width="10" height="11" rx="1.5" fill="#dc2626"/>
    <line x1="43" y1="28" x2="43" y2="31" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- ================================================
       BULLISH CANDLESTICK — above right D
       Centered at x=121
  ================================================ -->
  <g filter="url(#dlSmall)">
    <line x1="121" y1="9" x2="121" y2="17" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="116" y="17" width="10" height="11" rx="1.5" fill="#16a34a"/>
    <line x1="121" y1="28" x2="121" y2="32" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- ================================================
       LEFT D — RED (bearish)
       Outer: x=12–74, y=34–118
       Center: x≈43, y=76
  ================================================ -->
  <path fill-rule="evenodd"
        d="M 12,34 L 12,118 L 30,118 Q 74,118 74,76 Q 74,34 30,34 Z
           M 24,47 L 24,105 Q 60,105 60,76 Q 60,47 24,47 Z"
        fill="url(#dlRed)"
        filter="url(#dlRedGlow)"/>

  <!-- ================================================
       RIGHT D — GREEN (bullish)
       Outer: x=84–146, y=34–118
       Center: x≈115, y=76
  ================================================ -->
  <path fill-rule="evenodd"
        d="M 84,34 L 84,118 L 102,118 Q 146,118 146,76 Q 146,34 102,34 Z
           M 96,47 L 96,105 Q 132,105 132,76 Q 132,47 96,47 Z"
        fill="url(#dlGreen)"
        filter="url(#dlGreenGlow)"/>

  <!-- Down arrow below left D -->
  <polygon points="43,128 35,119 51,119" fill="#dc2626" opacity="0.9" filter="url(#dlSmall)"/>
  <!-- Up arrow below right D -->
  <polygon points="115,119 107,128 123,128" fill="#16a34a" opacity="0.9" filter="url(#dlSmall)"/>

  <!-- Mini sparkline under the DD icon area -->
  <polyline
    points="12,133 28,130 42,132 56,127 70,130 84,125 98,128 112,123 126,126 140,121 146,122"
    fill="none" stroke="#1e3a5f" stroke-width="1.2"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================================================
       VERTICAL DIVIDER
  ================================================ -->
  <rect x="166" y="16" width="1" height="108" rx="0.5" fill="#1d3558"/>
  <!-- Gold accent dot at top of divider -->
  <circle cx="166" cy="20" r="3" fill="#c9a84c" opacity="0.85" filter="url(#dlGold)"/>

  <!-- ================================================
       TEXT — right side
  ================================================ -->
  <!-- "DayDom" main wordmark -->
  <text x="184" y="82"
        font-family="'Inter', 'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-size="52"
        letter-spacing="-1"
        fill="url(#dlText)">DayDom</text>

  <!-- "PERFORMANCE GROUP" tagline -->
  <text x="186" y="106"
        font-family="'Space Mono', 'Courier New', Courier, monospace"
        font-weight="400"
        font-size="11"
        letter-spacing="4.5"
        fill="#3a5578">PERFORMANCE GROUP</text>

  <!-- Ticker-tape accent line under tagline -->
  <line x1="186" y1="114" x2="510" y2="114"
        stroke="#1a2f4a" stroke-width="0.75"/>

  <!-- Mini decorative candlesticks — top right corner (flavor) -->
  <!-- Bar 1 (small, bearish) -->
  <g opacity="0.35">
    <line x1="456" y1="22" x2="456" y2="27" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="452" y="27" width="8" height="9" rx="1" fill="#dc2626"/>
    <line x1="456" y1="36" x2="456" y2="39" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Bar 2 (taller, bullish) -->
  <g opacity="0.35">
    <line x1="470" y1="19" x2="470" y2="27" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="466" y="27" width="8" height="12" rx="1" fill="#16a34a"/>
    <line x1="470" y1="39" x2="470" y2="41" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Bar 3 (medium, bearish) -->
  <g opacity="0.35">
    <line x1="484" y1="23" x2="484" y2="28" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="480" y="28" width="8" height="8" rx="1" fill="#dc2626"/>
    <line x1="484" y1="36" x2="484" y2="40" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Bar 4 (tall, bullish) -->
  <g opacity="0.35">
    <line x1="498" y1="17" x2="498" y2="27" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="494" y="27" width="8" height="14" rx="1" fill="#16a34a"/>
    <line x1="498" y1="41" x2="498" y2="43" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  </g>

</svg>
