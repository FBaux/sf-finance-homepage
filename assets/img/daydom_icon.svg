<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="DayDom Performance Group Icon">
  <defs>
    <!-- Background -->
    <linearGradient id="ddBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="100%" stop-color="#0b1524"/>
    </linearGradient>
    <!-- Red gradient (bearish) -->
    <linearGradient id="ddRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7070"/>
      <stop offset="55%" stop-color="#e02020"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <!-- Green gradient (bullish) -->
    <linearGradient id="ddGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5ef59a"/>
      <stop offset="55%" stop-color="#18c058"/>
      <stop offset="100%" stop-color="#065c28"/>
    </linearGradient>
    <!-- Red letter glow -->
    <filter id="ddRedGlow" x="-45%" y="-35%" width="190%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feFlood flood-color="#ff1a1a" flood-opacity="0.55" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Green letter glow -->
    <filter id="ddGreenGlow" x="-45%" y="-35%" width="190%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feFlood flood-color="#00ee44" flood-opacity="0.45" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Small element glow -->
    <filter id="ddSmallGlow" x="-80%" y="-80%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="26" fill="url(#ddBg)"/>
  <!-- Thin border ring -->
  <rect x="1.5" y="1.5" width="197" height="197" rx="24.5"
        fill="none" stroke="#1d2e4a" stroke-width="1.5"/>
  <!-- Inner subtle border -->
  <rect x="6" y="6" width="188" height="188" rx="20"
        fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>

  <!-- Trading terminal grid lines -->
  <line x1="10" y1="94" x2="190" y2="94" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
  <line x1="10" y1="60" x2="190" y2="60" stroke="#ffffff" stroke-opacity="0.018" stroke-width="1"/>
  <line x1="10" y1="128" x2="190" y2="128" stroke="#ffffff" stroke-opacity="0.018" stroke-width="1"/>

  <!-- ================================================
       BEARISH CANDLESTICK — above left D (red)
       Centered at x=47
  ================================================ -->
  <g filter="url(#ddSmallGlow)">
    <!-- Upper wick (bearish: small high shadow) -->
    <line x1="47" y1="9" x2="47" y2="17" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <!-- Candle body: BEARISH = open at top, close at bottom → red fill -->
    <rect x="41" y="17" width="12" height="14" rx="2" fill="#dc2626"/>
    <!-- Lower wick -->
    <line x1="47" y1="31" x2="47" y2="34" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ================================================
       BULLISH CANDLESTICK — above right D (green)
       Centered at x=137
  ================================================ -->
  <g filter="url(#ddSmallGlow)">
    <!-- Upper wick (bullish: small high shadow) -->
    <line x1="137" y1="8" x2="137" y2="17" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    <!-- Candle body: BULLISH = open at bottom, close at top → green fill -->
    <rect x="131" y="17" width="12" height="14" rx="2" fill="#16a34a"/>
    <!-- Lower wick (bullish often has larger lower wick) -->
    <line x1="137" y1="31" x2="137" y2="35" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ================================================
       LEFT D — RED (bearish)
       Outer: x=12–86, y=37–153
       Stem left edge: x=12, inner left: x=27
       Curve peak outer: x=86, inner: x=70
       Hollow via evenodd fill-rule
  ================================================ -->
  <path fill-rule="evenodd"
        d="M 12,37 L 12,153 L 34,153 Q 86,153 86,95 Q 86,37 34,37 Z
           M 27,53 L 27,137 Q 70,137 70,95 Q 70,53 27,53 Z"
        fill="url(#ddRed)"
        filter="url(#ddRedGlow)"/>

  <!-- ================================================
       RIGHT D — GREEN (bullish)
       Outer: x=98–172, y=37–153
  ================================================ -->
  <path fill-rule="evenodd"
        d="M 98,37 L 98,153 L 120,153 Q 172,153 172,95 Q 172,37 120,37 Z
           M 113,53 L 113,137 Q 156,137 156,95 Q 156,53 113,53 Z"
        fill="url(#ddGreen)"
        filter="url(#ddGreenGlow)"/>

  <!-- ================================================
       ARROWS below the D letters
  ================================================ -->
  <!-- Down arrow (bearish) below left D -->
  <polygon points="47,166 39,155 55,155" fill="#dc2626" opacity="0.92"
           filter="url(#ddSmallGlow)"/>

  <!-- Up arrow (bullish) below right D -->
  <polygon points="137,155 129,166 145,166" fill="#16a34a" opacity="0.92"
           filter="url(#ddSmallGlow)"/>

  <!-- ================================================
       MINI SPARKLINE — stock chart at the bottom
  ================================================ -->
  <polyline
    points="18,183 32,179 46,182 60,175 74,179 88,172 100,176 114,169 128,173 142,167 156,170 170,164 182,167"
    fill="none" stroke="#1e3a5f" stroke-width="1.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Highlight dot on chart (last known price) -->
  <circle cx="182" cy="167" r="2.5" fill="#2d5f9e" opacity="0.8"/>

</svg>
