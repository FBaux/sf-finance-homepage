<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayDom Logo Preview</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #111827;
      font-family: 'Courier New', monospace;
      color: #9ca3af;
    }
    .section {
      margin-bottom: 48px;
    }
    .label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #4b5563;
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 32px;
      flex-wrap: wrap;
    }
    .bg-dark  { background: #06090f; padding: 24px; border-radius: 12px; }
    .bg-light { background: #f0f0f0; padding: 24px; border-radius: 12px; }
    .bg-white { background: #ffffff; padding: 24px; border-radius: 12px; }
  </style>
</head>
<body>

  <div class="section">
    <div class="label">Icon — 200 × 200</div>
    <div class="row">
      <div class="bg-dark">
        <img src="daydom_icon.svg" width="200" height="200" alt="DayDom Icon">
      </div>
      <div class="bg-dark">
        <img src="daydom_icon.svg" width="100" height="100" alt="DayDom Icon small">
      </div>
      <div class="bg-dark">
        <img src="daydom_icon.svg" width="48" height="48" alt="DayDom Icon xs">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="label">Horizontal Wordmark — 520 × 140</div>
    <div class="row">
      <div class="bg-dark">
        <img src="daydom_logo.svg" width="520" height="140" alt="DayDom Logo">
      </div>
    </div>
    <br>
    <div class="row">
      <div class="bg-dark">
        <img src="daydom_logo.svg" width="320" height="86" alt="DayDom Logo medium">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="label">Comparison — SF Finance vs DayDom</div>
    <div class="row">
      <div class="bg-dark">
        <img src="logo_primary.svg" width="400" height="83" alt="SF Finance Primary">
      </div>
    </div>
    <br>
    <div class="row">
      <div class="bg-dark">
        <img src="daydom_logo.svg" width="400" height="108" alt="DayDom Logo">
      </div>
    </div>
  </div>

</body>
</html>
