# Supabase project configuration
# Run: npx supabase link --project-ref YOUR_PROJECT_REF
# to connect this to your Supabase project.

[project]
id = "daydom-gbr-portal"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Disable email confirmations in local dev
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false   # only admins can create users
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

# ── Edge Functions ──────────────────────────────────────────────────────────

[functions.portal-files]
verify_jwt = true    # auth: "user" — valid JWT required

[functions.admin]
verify_jwt = false   # auth: "secret" — validated by @supabase/server itself
