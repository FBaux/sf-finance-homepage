name: Red Folder Tests

on:
  pull_request:
    paths: ['news/**', '.github/workflows/red-folder*.yml']
  push:
    branches: [main]
    paths: ['news/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python news/test_red_folder.py -v
