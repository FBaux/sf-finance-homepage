name: Video Clip Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL zum Rohmaterial (optional, überschreibt Release Asset)'
        required: false
        type: string
      dry_run:
        description: 'Dry-Run (kein echter Upload)'
        required: false
        type: boolean
        default: false
  schedule:
    # Täglich 06:00 UTC = 07:00 CET / 08:00 CEST
    - cron: '0 6 * * *'

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job 1: Clip-Erkennung und Video-Verarbeitung
  # ──────────────────────────────────────────────────────────────────
  detect-and-process:
    name: KI-Analyse & Video-Verarbeitung
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsm6 libxext6

      - name: Cache Whisper-Modell
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-base-model-v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download Rohmaterial (Release Asset)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Suche nach dem neuesten Release mit Raw-Footage
          RELEASE=$(gh release view raw-footage --json assets --jq '.assets[0].url' 2>/dev/null || echo "")
          if [ -n "$RELEASE" ]; then
            echo "Lade Release Asset: $RELEASE"
            mkdir -p /tmp/input
            gh release download raw-footage --dir /tmp/input
            VIDEO_FILE=$(find /tmp/input -name "*.mp4" | head -1)
            echo "INPUT_VIDEO=$VIDEO_FILE" >> $GITHUB_ENV
            echo "Gefunden: $VIDEO_FILE"
          else
            echo "Kein Release Asset gefunden — überspringe Verarbeitung."
            echo "INPUT_VIDEO=" >> $GITHUB_ENV
          fi

      - name: Override Video-URL (workflow_dispatch)
        if: ${{ github.event.inputs.video_url != '' }}
        run: |
          mkdir -p /tmp/input
          curl -L "${{ github.event.inputs.video_url }}" -o /tmp/input/video.mp4
          echo "INPUT_VIDEO=/tmp/input/video.mp4" >> $GITHUB_ENV

      - name: Clip-Analyse (Whisper + Claude KI)
        if: ${{ env.INPUT_VIDEO != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_VIDEO: ${{ env.INPUT_VIDEO }}
        run: |
          python sync/clip_analyzer.py --input "$INPUT_VIDEO"

      - name: Video-Verarbeitung (FFmpeg Crop + Encode)
        if: ${{ env.INPUT_VIDEO != '' }}
        run: |
          python sync/video_processor.py --output-dir /tmp/processed

      - name: Caption & Overlay-Generierung
        if: ${{ env.INPUT_VIDEO != '' }}
        run: |
          python sync/caption_generator.py --output-dir /tmp/captioned

      - name: Clip-Scheduling
        if: ${{ env.INPUT_VIDEO != '' }}
        run: |
          python sync/scheduler.py

      - name: Commit Clip-Metadaten
        run: |
          git config --local user.email "bot@fsfinance.de"
          git config --local user.name "SF Finance Bot"
          git add api/clips.json
          git diff --staged --quiet || git commit -m "chore: clip queue update $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
          git push

      # Verarbeitete Video-Dateien als Artifact für Job 2 bereitstellen
      - name: Upload Processed Clips Artifact
        if: ${{ env.INPUT_VIDEO != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: processed-clips
          path: /tmp/captioned/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────
  # Job 2: Automatisches Posten fälliger Clips
  # ──────────────────────────────────────────────────────────────────
  post-due-clips:
    name: Posts veröffentlichen
    runs-on: ubuntu-latest
    needs: detect-and-process
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Aktuellen Stand holen (nach Job 1 Commit)
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download Processed Clips
        uses: actions/download-artifact@v4
        with:
          name: processed-clips
          path: /tmp/captioned/
        continue-on-error: true

      - name: Poste auf TikTok
        env:
          TIKTOK_ACCESS_TOKEN:  ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY:    ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          python sync/tiktok_post.py $DRY

      - name: Poste auf YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          python sync/youtube_post.py $DRY

      - name: Commit aktualisierte Clip-Daten
        run: |
          git config --local user.email "bot@fsfinance.de"
          git config --local user.name "SF Finance Bot"
          git add api/clips.json
          git diff --staged --quiet || git commit -m "chore: clips posted $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
          git push

  # ──────────────────────────────────────────────────────────────────
  # Job 3: Analytics-Update (läuft immer, auch ohne neue Clips)
  # ──────────────────────────────────────────────────────────────────
  update-analytics:
    name: Analytics aktualisieren
    runs-on: ubuntu-latest
    needs: post-due-clips
    if: always()
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests google-api-python-client google-auth

      - name: Aktualisiere Clip-Analytics
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY:   ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          YOUTUBE_TOKEN_JSON:  ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python sync/fetch_data.py --clips-only 2>/dev/null || python sync/fetch_data.py

      - name: Commit Analytics-Update
        run: |
          git config --local user.email "bot@fsfinance.de"
          git config --local user.name "SF Finance Bot"
          git add api/data.json api/clips.json
          git diff --staged --quiet || git commit -m "chore: analytics update $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
          git push
