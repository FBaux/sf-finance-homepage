name: Red Folder Alert

on:
  schedule:
    - cron: '30 4 * * 1-5'  # 06:30 Berlin im Sommer (CEST)
    - cron: '30 5 * * 1-5'  # 06:30 Berlin im Winter (CET)
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send red folder events to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          COUNTRIES:          ${{ vars.RED_FOLDER_COUNTRIES || 'USD' }}
          CRON_SCHEDULE:      ${{ github.event.schedule }}
        run: python news/red_folder.py
